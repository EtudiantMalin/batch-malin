<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Étudiant-Malin — Espace Personnel</title>
  <link rel="stylesheet" href="./core/theme.css" />
</head>
<body>
  <!-- Écran 1 : Authentification -->
  <main id="auth-view" class="auth-wrapper">
    <section class="auth-card">
      <div class="auth-card__logo">ÉM</div>
      <h1 id="auth-title">Étudiant-Malin</h1>
      <p id="auth-subtitle">Connectez-vous à votre espace personnel.</p>

      <form id="auth-form" class="auth-form">
        <input
          type="email"
          id="auth-email"
          class="em-input"
          placeholder="Adresse e-mail"
          required
          autocomplete="email"
        />
        <input
          type="password"
          id="auth-password"
          class="em-input"
          placeholder="Mot de passe (6 caractères min.)"
          minlength="6"
          required
          autocomplete="current-password"
        />
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" id="auth-submit-btn" class="em-btn em-btn--primary">
          Continuer
        </button>
      </form>

      <div class="auth-switch">
        <span id="auth-switch-text">Pas encore de compte ?</span>
        <button type="button" id="auth-switch-btn">Créer un compte</button>
      </div>
    </section>
  </main>

  <!-- Écran 2 : Launcher Radial -->
  <div id="app-view" class="hidden">
    <header class="em-topbar">
      <div class="em-brand">Étudiant-Malin</div>
      <div class="em-user-bar">
        <span id="user-email-label"></span>
        <button type="button" id="btn-logout" class="em-btn em-btn--ghost">Déconnexion</button>
      </div>
    </header>

    <main class="launcher-stage">
      <div id="orb-arena" class="orb-arena">
        <button type="button" id="core-orb" class="core-orb" aria-label="Ouvrir les applications">
          <span class="core-orb__title">Étudiant-Malin</span>
          <span class="core-orb__hint">Toucher pour ouvrir</span>
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="./core/portal.js"></script>
</body>
</html>
